name: Publish Helm repository

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to publish
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: helm-repository
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Helm repository
    runs-on: ubuntu-latest

    steps:
      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.19.0

      - name: Download chart from the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          mkdir -p helm-repository
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'stowmark-observability-*.tgz' \
            --dir helm-repository

      - name: Restore the existing repository index
        run: |
          curl --fail --silent --show-error --location \
            "https://${GITHUB_REPOSITORY_OWNER}.github.io/stowmark-observability/index.yaml" \
            --output /tmp/index.yaml || true

      - name: Generate Helm repository index
        run: |
          repository_url="https://${GITHUB_REPOSITORY_OWNER}.github.io/stowmark-observability"

          if test -s /tmp/index.yaml; then
            helm repo index helm-repository \
              --url "$repository_url" \
              --merge /tmp/index.yaml
          else
            helm repo index helm-repository --url "$repository_url"
          fi

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./helm-repository
          publish_branch: gh-pages
          keep_files: true
          enable_jekyll: false
