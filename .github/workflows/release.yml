name: Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.19.0

      - name: Add Helm repositories
        run: |
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Validate JSON files
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Validating $file"
            jq empty "$file"
          done < <(
            find . \
              -path './node_modules' -prune -o \
              -path './charts/stowmark-observability/charts' -prune -o \
              -type f -name '*.json' -print0
          )

      - name: Validate scripts
        run: |
          bash -n scripts/*.sh
          sh -n packaging/postinst packaging/prerm packaging/postrm

      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Restore Helm dependencies
        run: helm dependency build charts/stowmark-observability

      - name: Lint Helm chart
        run: |
          helm lint charts/stowmark-observability \
            --values charts/stowmark-observability/values-test.yaml

      - name: Render Helm test manifests
        run: |
          helm template stowmark-test charts/stowmark-observability \
            --namespace stowmark-test \
            --values charts/stowmark-observability/values-test.yaml \
            > /tmp/stowmark-test.yaml

          grep -q 'stowmark-overview.json' /tmp/stowmark-test.yaml

          if grep -q '^kind: PersistentVolumeClaim$' /tmp/stowmark-test.yaml; then
            echo "Unexpected persistent volume claim found in test manifests" >&2
            exit 1
          fi

  release:
    name: Release
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.19.0

      - name: Add Helm repositories
        run: |
          helm repo add grafana-community https://grafana-community.github.io/helm-charts
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Install release dependencies
        run: npm ci

      - name: Restore Helm dependencies
        run: helm dependency build charts/stowmark-observability

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
