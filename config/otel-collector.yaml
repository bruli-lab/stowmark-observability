receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 5s
  # Stowmark is a CLI: every run is a new process that reports cumulative
  # counters starting from zero. Convert each run to deltas and sum them
  # back into one running total per series, so Prometheus sees counters
  # that keep growing across runs.
  cumulative_to_delta: {}
  delta_to_cumulative:
    max_stale: 720h

exporters:
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
    # Keep the accumulated totals between runs (the default is 5m, after
    # which a CLI's series would vanish and restart from zero).
    metric_expiration: 720h

service:
  telemetry:
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, cumulative_to_delta, delta_to_cumulative, batch]
      exporters: [prometheus]
