# Default values for stowmark-observability.
# Cluster-specific settings should be provided with an additional values file.

grafana:
  fullnameOverride: stowmark-grafana

  adminUser: admin

  persistence:
    enabled: true
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  service:
    type: ClusterIP
    port: 80

  # The sidecars only watch the release namespace, so several installations
  # in one cluster do not load each other's dashboards and data sources.
  rbac:
    namespaced: true

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      # Place dashboards in the folder named by this ConfigMap annotation
      # ("Stowmark", as in Docker Compose).
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"

  grafana.ini:
    users:
      allow_sign_up: false

    auth.anonymous:
      enabled: false

loki:
  fullnameOverride: stowmark-loki

  deploymentMode: Monolithic

  loki:
    auth_enabled: false

    commonConfig:
      path_prefix: /var/loki
      replication_factor: 1

    storage:
      type: filesystem
      filesystem:
        chunks_directory: /var/loki/chunks
        rules_directory: /var/loki/rules

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 168h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      allow_structured_metadata: true
      volume_enabled: true

    compactor:
      retention_enabled: true
      delete_request_store: filesystem

  singleBinary:
    enabled: true
    replicas: 1

    persistence:
      enabled: true
      size: 10Gi
      accessModes:
        - ReadWriteOnce

  # Disable Simple Scalable mode.
  read:
    replicas: 0

  write:
    replicas: 0

  backend:
    replicas: 0

  gateway:
    enabled: true

  # The chart's memcached caches request ~11 GiB of memory by default
  # (chunks ~9.6 GiB, results ~1.2 GiB); unnecessary for this workload.
  chunksCache:
    enabled: false

  resultsCache:
    enabled: false

  test:
    enabled: true

  # Loki rules are not used. The rules sidecar would otherwise need a
  # ClusterRole that reads every ConfigMap and Secret in the cluster, and its
  # fixed name would clash between releases in different namespaces.
  sidecar:
    rules:
      enabled: false

  rbac:
    namespaced: true

tempo:
  fullnameOverride: stowmark-tempo

  tempo:
    reportingEnabled: false
    streamOverHttpEnabled: true

    # The chart defaults to 24h, shorter than the dashboard's 7-day range.
    # 336h is Tempo's own default, which Docker Compose uses.
    retention: 336h

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

  persistence:
    enabled: true
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  service:
    type: ClusterIP

prometheus:
  server:
    fullnameOverride: stowmark-prometheus

    persistentVolume:
      enabled: true
      size: 10Gi
      accessModes:
        - ReadWriteOnce

    retention: 15d

    extraFlags:
      - web.enable-lifecycle

  alertmanager:
    enabled: false

  kube-state-metrics:
    enabled: false

  prometheus-node-exporter:
    enabled: false

  prometheus-pushgateway:
    enabled: false

  # Only the Stowmark stack is scraped: disable the chart's cluster-wide
  # Kubernetes jobs, and with them the ClusterRole they need.
  rbac:
    create: false

  scrapeConfigs:
    kubernetes-api-servers:
      enabled: false
    kubernetes-nodes:
      enabled: false
    kubernetes-nodes-cadvisor:
      enabled: false
    kubernetes-service-endpoints:
      enabled: false
    kubernetes-service-endpoints-slow:
      enabled: false
    prometheus-pushgateway:
      enabled: false
    kubernetes-services:
      enabled: false
    kubernetes-pods:
      enabled: false
    kubernetes-pods-slow:
      enabled: false

  # Same jobs as config/prometheus.yaml: Collector self-metrics (8888) and
  # the Stowmark metrics exported by the Collector (8889).
  extraScrapeConfigs: |
    - job_name: otel-collector
      scrape_interval: 15s
      static_configs:
        - targets:
            - stowmark-otel-collector:8888

    - job_name: stowmark
      scrape_interval: 15s
      static_configs:
        - targets:
            - stowmark-otel-collector:8889

otelCollector:
  fullnameOverride: stowmark-otel-collector

  mode: deployment

  replicaCount: 1

  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.159.0"
    pullPolicy: IfNotPresent

  command:
    name: otelcol-contrib

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

  ports:
    # Only OTLP and the metrics endpoints are used.
    jaeger-compact:
      enabled: false
    jaeger-thrift:
      enabled: false
    jaeger-grpc:
      enabled: false
    zipkin:
      enabled: false

    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
      appProtocol: grpc

    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      protocol: TCP

    metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP

    prometheus:
      enabled: true
      containerPort: 8889
      servicePort: 8889
      protocol: TCP

  service:
    enabled: true
    type: ClusterIP

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      # Drop the chart's default receivers; only OTLP is used.
      jaeger: null
      zipkin: null
      prometheus: null

    processors:
      # The chart's defaults size the limiter as a percentage (80% / 25%) of
      # resources.limits.memory. Do not set limit_mib/spike_limit_mib here:
      # they would be merged with the percentages (and null is kept literally).
      memory_limiter:
        check_interval: 1s

      batch:
        timeout: 5s

      # Stowmark is a CLI: every run is a new process that reports cumulative
      # counters starting from zero. Convert each run to deltas and sum them
      # back into one running total per series, so Prometheus sees counters
      # that keep growing across runs. Same as config/otel-collector.yaml.
      cumulative_to_delta: {}
      delta_to_cumulative:
        max_stale: 720h

    exporters:
      otlphttp/loki:
        endpoint: http://stowmark-loki-gateway/otlp
        tls:
          insecure: true

      otlp/tempo:
        endpoint: stowmark-tempo:4317
        tls:
          insecure: true

      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true
        # Keep the accumulated totals between runs (the default is 5m, after
        # which a CLI's series would vanish and restart from zero).
        metric_expiration: 720h

    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888

      pipelines:
        logs:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - otlphttp/loki

        traces:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - otlp/tempo

        metrics:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - cumulative_to_delta
            - delta_to_cumulative
            - batch
          exporters:
            - prometheus
