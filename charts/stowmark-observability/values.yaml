# Default values for stowmark-observability.
# Cluster-specific settings should be provided with an additional values file.

grafana:
  fullnameOverride: stowmark-grafana

  adminUser: admin

  persistence:
    enabled: true
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  service:
    type: ClusterIP
    port: 80

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL

    datasources:
      enabled: true
      label: grafana_datasource
      labelValue: "1"
      searchNamespace: ALL

  grafana.ini:
    users:
      allow_sign_up: false

    auth.anonymous:
      enabled: false

loki:
  fullnameOverride: stowmark-loki

  deploymentMode: Monolithic

  loki:
    auth_enabled: false

    commonConfig:
      path_prefix: /var/loki
      replication_factor: 1

    storage:
      type: filesystem
      filesystem:
        chunks_directory: /var/loki/chunks
        rules_directory: /var/loki/rules

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      retention_period: 168h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      allow_structured_metadata: true
      volume_enabled: true

    compactor:
      retention_enabled: true
      delete_request_store: filesystem

  singleBinary:
    enabled: true
    replicas: 1

    persistence:
      enabled: true
      size: 10Gi
      accessModes:
        - ReadWriteOnce

  # Disable Simple Scalable mode.
  read:
    replicas: 0

  write:
    replicas: 0

  backend:
    replicas: 0

  gateway:
    enabled: true

  test:
    enabled: true

tempo:
  fullnameOverride: stowmark-tempo

  tempo:
    reportingEnabled: false

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

  persistence:
    enabled: true
    size: 10Gi
    accessModes:
      - ReadWriteOnce

  service:
    type: ClusterIP

prometheus:
  server:
    fullnameOverride: stowmark-prometheus

    persistentVolume:
      enabled: true
      size: 10Gi
      accessModes:
        - ReadWriteOnce

    retention: 15d

  alertmanager:
    enabled: false

  kube-state-metrics:
    enabled: false

  prometheus-node-exporter:
    enabled: false

  prometheus-pushgateway:
    enabled: false

  extraScrapeConfigs: |
    - job_name: stowmark-otel-collector
      scrape_interval: 15s
      static_configs:
        - targets:
            - stowmark-otel-collector:8889

otelCollector:
  fullnameOverride: stowmark-otel-collector

  mode: deployment

  replicaCount: 1

  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.159.0"
    pullPolicy: IfNotPresent

  command:
    name: otelcol-contrib

  ports:
    otlp:
      enabled: true
      containerPort: 4317
      servicePort: 4317
      protocol: TCP
      appProtocol: grpc

    otlp-http:
      enabled: true
      containerPort: 4318
      servicePort: 4318
      protocol: TCP

    metrics:
      enabled: true
      containerPort: 8888
      servicePort: 8888
      protocol: TCP

    prometheus:
      enabled: true
      containerPort: 8889
      servicePort: 8889
      protocol: TCP

  service:
    enabled: true
    type: ClusterIP

  config:
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64

      batch:
        timeout: 5s

    exporters:
      otlphttp/loki:
        endpoint: http://stowmark-loki-gateway/otlp
        tls:
          insecure: true

      otlp/tempo:
        endpoint: stowmark-tempo:4317
        tls:
          insecure: true

      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true

    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888

      pipelines:
        logs:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - otlphttp/loki

        traces:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - otlp/tempo

        metrics:
          receivers:
            - otlp
          processors:
            - memory_limiter
            - batch
          exporters:
            - prometheus