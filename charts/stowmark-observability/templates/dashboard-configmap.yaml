apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stowmark-observability.fullname" . }}-dashboards
  labels:
    {{- include "stowmark-observability.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Stowmark
data:
  stowmark-overview.json: |
{{ .Files.Get "dashboards/stowmark-overview.json" | indent 4 }}
