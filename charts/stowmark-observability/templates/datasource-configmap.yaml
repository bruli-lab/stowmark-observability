apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "stowmark-observability.fullname" . }}-datasources
  labels:
    {{- include "stowmark-observability.labels" . | nindent 4 }}
    grafana_datasource: "1"
data:
  # Keep in sync with config/grafana/provisioning/datasources/datasources.yaml
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://stowmark-prometheus
        isDefault: true
        editable: false

      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://stowmark-loki-gateway
        editable: false
        jsonData:
          derivedFields:
            # Stowmark's OTLP logs carry trace_id as structured metadata.
            - name: TraceID
              matcherType: label
              matcherRegex: trace_id
              datasourceUid: tempo
              # $$ escapes Grafana's environment variable expansion in provisioning.
              url: '$${__value.raw}'

      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://stowmark-tempo:3200
        editable: false
        jsonData:
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            filterByTraceID: true
          tracesToMetrics:
            datasourceUid: prometheus
          # No serviceMap: see config/grafana/provisioning/datasources/datasources.yaml
          nodeGraph:
            enabled: true
