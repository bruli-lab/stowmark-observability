version: "3"

includes:
  helm:
    taskfile: ./taskfiles/helm.yml
    dir: .

tasks:
  default:
    desc: Show help
    cmds:
      - task --list
  init:
    desc: Create the local environment file with a random Grafana password
    status:
      - test -f .env
    cmds:
      - sed "s/^GRAFANA_ADMIN_PASSWORD=.*/GRAFANA_ADMIN_PASSWORD=$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n')/" .env.example > .env
      - echo "Created .env with a random GRAFANA_ADMIN_PASSWORD"

  validate:
    desc: Validate the resolved Compose configuration
    deps: [init]
    cmds:
      - docker compose config --quiet

  validate:configs:
    desc: Validate service configs with their images and check the dashboard copies
    cmds:
      - bash scripts/validate-configs.sh {{.CLI_ARGS}}

  up:
    desc: Start the observability stack
    deps: [init]
    cmds:
      - docker compose up -d

  down:
    desc: Stop the observability stack
    cmds:
      - docker compose down

  logs:
    desc: Follow stack logs
    cmds:
      - docker compose logs -f

  status:
    desc: Show container status
    cmds:
      - docker compose ps

  clean:
    desc: Stop the stack and remove its persistent volumes
    prompt: This removes all local observability data. Continue?
    cmds:
      - docker compose down --volumes

  package:
    desc: Build the Debian package (for example, task package VERSION=0.1.0)
    requires:
      vars: [VERSION]
    cmds:
      - ./scripts/build-deb.sh {{.VERSION}}
